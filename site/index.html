<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>money-1 | 코딩 수익화 리서치</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --surface2: #242424;
      --border: #333;
      --text: #e0e0e0;
      --text-dim: #888;
      --accent: #4f9cf7;
      --green: #4caf50;
      --yellow: #ffb74d;
      --red: #ef5350;
      --purple: #ab47bc;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 0;
    }

    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
    }

    .header h1 span {
      color: var(--accent);
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .build-time {
      font-size: 12px;
      color: var(--text-dim);
    }

    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    /* Navigation Tabs */
    .tabs {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
      overflow-x: auto;
    }

    .tab {
      padding: 10px 16px;
      font-size: 14px;
      color: var(--text-dim);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .tab:hover { color: var(--text); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* Cards */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Score Badge */
    .score-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
    }

    .score-high { background: rgba(76,175,80,0.15); color: var(--green); }
    .score-mid { background: rgba(255,183,77,0.15); color: var(--yellow); }
    .score-low { background: rgba(239,83,80,0.15); color: var(--red); }

    .decision-badge {
      display: inline-flex;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .decision-진행 { background: rgba(76,175,80,0.15); color: var(--green); }
    .decision-보류 { background: rgba(255,183,77,0.15); color: var(--yellow); }
    .decision-폐기 { background: rgba(239,83,80,0.15); color: var(--red); }
    .decision-미정 { background: rgba(136,136,136,0.15); color: var(--text-dim); }

    /* Score Bar */
    .score-bar-container {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .score-item {
      flex: 1;
      min-width: 120px;
    }

    .score-item-label {
      font-size: 11px;
      color: var(--text-dim);
      margin-bottom: 4px;
    }

    .score-bar-bg {
      height: 6px;
      background: var(--surface2);
      border-radius: 3px;
      overflow: hidden;
    }

    .score-bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.5s ease;
    }

    /* Idea Detail */
    .idea-sections {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
    }

    .idea-section {
      background: var(--surface2);
      border-radius: 8px;
      padding: 14px;
    }

    .idea-section-title {
      font-size: 12px;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .idea-section-content {
      font-size: 13px;
      color: var(--text);
      white-space: pre-line;
      line-height: 1.5;
    }

    /* Research */
    .research-content {
      font-size: 14px;
      line-height: 1.7;
      white-space: pre-line;
    }

    .research-content h2,
    .research-content h3 {
      margin-top: 16px;
      margin-bottom: 8px;
    }

    /* Tracker */
    .tracker-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    .tracker-table th,
    .tracker-table td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    .tracker-table th {
      color: var(--text-dim);
      font-weight: 500;
      font-size: 12px;
    }

    /* Goal Banner */
    .goal-banner {
      background: linear-gradient(135deg, #1a237e, #283593);
      border-radius: 10px;
      padding: 24px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .goal-label {
      font-size: 14px;
      color: rgba(255,255,255,0.7);
    }

    .goal-amount {
      font-size: 32px;
      font-weight: 700;
      color: #fff;
    }

    .goal-progress {
      text-align: right;
    }

    .goal-progress-label {
      font-size: 12px;
      color: rgba(255,255,255,0.5);
    }

    .goal-progress-value {
      font-size: 24px;
      font-weight: 700;
      color: var(--accent);
    }

    /* Markdown rendering */
    .md-content {
      font-size: 14px;
      line-height: 1.7;
    }

    .md-content h1 { font-size: 20px; margin: 16px 0 8px; }
    .md-content h2 { font-size: 17px; margin: 14px 0 6px; color: var(--accent); }
    .md-content h3 { font-size: 15px; margin: 12px 0 4px; }
    .md-content ul, .md-content ol { padding-left: 20px; margin: 8px 0; }
    .md-content li { margin: 4px 0; }
    .md-content strong { color: #fff; }
    .md-content code { background: var(--surface2); padding: 2px 6px; border-radius: 3px; font-size: 13px; }
    .md-content table { width: 100%; border-collapse: collapse; margin: 8px 0; }
    .md-content th, .md-content td { padding: 8px 10px; border: 1px solid var(--border); font-size: 13px; }
    .md-content th { background: var(--surface2); font-weight: 500; }
    .md-content a { color: var(--accent); text-decoration: none; }
    .md-content a:hover { text-decoration: underline; }
    .md-content blockquote { border-left: 3px solid var(--accent); padding-left: 12px; color: var(--text-dim); margin: 8px 0; }

    /* Collapsible */
    .collapsible-toggle {
      cursor: pointer;
      user-select: none;
    }

    .collapsible-toggle::before {
      content: '▸ ';
      display: inline;
    }

    .collapsible-toggle.open::before {
      content: '▾ ';
    }

    .collapsible-body {
      display: none;
      padding-top: 12px;
    }

    .collapsible-body.open {
      display: block;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .idea-sections { grid-template-columns: 1fr; }
      .goal-banner { flex-direction: column; gap: 12px; text-align: center; }
      .goal-progress { text-align: center; }
      .header { flex-direction: column; gap: 12px; }
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 60px;
      color: var(--text-dim);
    }

    .spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="header">
    <h1><span>money-1</span> 코딩 수익화 리서치</h1>
    <div class="header-actions">
      <span class="build-time" id="buildTime"></span>
      <button class="btn btn-outline" onclick="location.reload()">새로고침</button>
      <button class="btn" id="researchBtn" onclick="triggerResearch()">재조사</button>
    </div>
  </div>

  <div class="container">
    <div class="tabs" id="tabs">
      <div class="tab active" data-tab="overview">개요</div>
      <div class="tab" data-tab="feed">수집 피드</div>
      <div class="tab" data-tab="ideas">아이디어</div>
      <div class="tab" data-tab="research">리서치</div>
      <div class="tab" data-tab="marketing">마케팅</div>
      <div class="tab" data-tab="log">주간 로그</div>
    </div>

    <!-- Overview -->
    <div class="tab-panel active" id="panel-overview">
      <div class="goal-banner">
        <div>
          <div class="goal-label">주간 목표</div>
          <div class="goal-amount">₩100,000</div>
        </div>
        <div class="goal-progress">
          <div class="goal-progress-label">이번 주 수익</div>
          <div class="goal-progress-value" id="currentRevenue">₩0</div>
        </div>
      </div>

      <h3 style="margin-bottom: 16px; font-size: 15px; color: var(--text-dim);">아이디어 순위</h3>
      <div id="ideaSummary"></div>

      <h3 style="margin: 24px 0 16px; font-size: 15px; color: var(--text-dim);">주간 트래커</h3>
      <div class="card">
        <table class="tracker-table" id="trackerTable">
          <thead>
            <tr><th>주차</th><th>날짜</th><th>수익</th><th>채널</th><th>달성률</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <!-- Feed -->
    <div class="tab-panel" id="panel-feed">
      <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">
        <button class="btn btn-outline feed-filter active" data-source="all">전체</button>
        <button class="btn btn-outline feed-filter" data-source="hackernews">HackerNews</button>
        <button class="btn btn-outline feed-filter" data-source="reddit">Reddit</button>
        <button class="btn btn-outline feed-filter" data-source="indiehackers">IndieHackers</button>
        <button class="btn btn-outline feed-filter" data-source="producthunt">ProductHunt</button>
      </div>
      <div id="feedContent"></div>
      <div id="feedEmpty" style="display:none;text-align:center;padding:40px;color:var(--text-dim)">
        아직 수집된 데이터가 없습니다.<br>
        <code>node scripts/research.js</code>를 실행하거나 GitHub Actions cron을 기다리세요.
      </div>
    </div>

    <!-- Ideas -->
    <div class="tab-panel" id="panel-ideas">
      <div id="ideaDetails"></div>
    </div>

    <!-- Research -->
    <div class="tab-panel" id="panel-research">
      <div id="researchContent"></div>
    </div>

    <!-- Marketing -->
    <div class="tab-panel" id="panel-marketing">
      <div id="marketingContent"></div>
    </div>

    <!-- Log -->
    <div class="tab-panel" id="panel-log">
      <div id="logContent"></div>
    </div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p style="margin-top: 12px;">데이터 로딩 중...</p>
    </div>
  </div>

  <script>
    let DATA = null;

    // Tab handling
    document.getElementById('tabs').addEventListener('click', (e) => {
      const tab = e.target.closest('.tab');
      if (!tab) return;

      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));

      tab.classList.add('active');
      document.getElementById(`panel-${tab.dataset.tab}`).classList.add('active');
    });

    // Simple markdown to HTML
    function md(text) {
      if (!text) return '';
      return text
        .replace(/^### (.+)$/gm, '<h3>$1</h3>')
        .replace(/^## (.+)$/gm, '<h2>$1</h2>')
        .replace(/^# (.+)$/gm, '<h1>$1</h1>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>')
        .replace(/`(.+?)`/g, '<code>$1</code>')
        .replace(/^\- (.+)$/gm, '<li>$1</li>')
        .replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>')
        .replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2" target="_blank">$1</a>')
        .replace(/^\> (.+)$/gm, '<blockquote>$1</blockquote>')
        .replace(/\|(.+)\|/g, (match) => {
          const cells = match.split('|').filter(c => c.trim());
          if (cells.every(c => c.trim().match(/^[-:]+$/))) return '';
          const tag = match.includes('---') ? 'th' : 'td';
          return '<tr>' + cells.map(c => `<${tag}>${c.trim()}</${tag}>`).join('') + '</tr>';
        })
        .replace(/(<tr>.*<\/tr>[\s\n]*)+/gs, '<table>$&</table>')
        .replace(/\n\n/g, '<br><br>')
        .replace(/\n/g, '<br>');
    }

    function scoreClass(score) {
      if (score >= 4.0) return 'score-high';
      if (score >= 3.5) return 'score-mid';
      return 'score-low';
    }

    function scoreColor(score) {
      if (score >= 4) return 'var(--green)';
      if (score >= 3) return 'var(--yellow)';
      return 'var(--red)';
    }

    function renderOverview() {
      // Idea summary cards
      const container = document.getElementById('ideaSummary');
      container.innerHTML = DATA.ideas.map(idea => `
        <div class="card" style="cursor:pointer" onclick="showIdeaTab('${idea.file}')">
          <div class="card-title">
            ${idea.title}
            <span class="score-badge ${scoreClass(idea.scores.total)}">${idea.scores.total?.toFixed(1) || '?'}</span>
            <span class="decision-badge decision-${idea.decision}">${idea.decision}</span>
          </div>
          <div style="font-size:13px;color:var(--text-dim)">${idea.summary || ''}</div>
          <div class="score-bar-container">
            ${Object.entries(idea.scores.criteria || {}).map(([name, {weight, score}]) => `
              <div class="score-item">
                <div class="score-item-label">${name} (${weight}%)</div>
                <div class="score-bar-bg">
                  <div class="score-bar-fill" style="width:${score*20}%;background:${scoreColor(score)}"></div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');

      // Tracker table
      if (DATA.tracker) {
        const tbody = document.querySelector('#trackerTable tbody');
        tbody.innerHTML = DATA.tracker.weeks.map(w => `
          <tr>
            <td>${w.week}</td>
            <td>${w.date}</td>
            <td>${w.revenue}</td>
            <td>${w.channel}</td>
            <td>${w.rate}</td>
          </tr>
        `).join('');
      }
    }

    function showIdeaTab(file) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      document.querySelector('[data-tab="ideas"]').classList.add('active');
      document.getElementById('panel-ideas').classList.add('active');
    }

    function renderIdeas() {
      const container = document.getElementById('ideaDetails');
      container.innerHTML = DATA.ideas.map(idea => `
        <div class="card">
          <div class="card-title">
            ${idea.title}
            <span class="score-badge ${scoreClass(idea.scores.total)}">${idea.scores.total?.toFixed(1) || '?'}</span>
            <span class="decision-badge decision-${idea.decision}">${idea.decision}</span>
          </div>
          <div style="font-size:13px;color:var(--text-dim);margin-bottom:12px">${idea.summary || ''}</div>

          <div class="score-bar-container" style="margin-bottom:16px">
            ${Object.entries(idea.scores.criteria || {}).map(([name, {weight, score}]) => `
              <div class="score-item">
                <div class="score-item-label">${name} (${weight}%) = ${score}/5</div>
                <div class="score-bar-bg">
                  <div class="score-bar-fill" style="width:${score*20}%;background:${scoreColor(score)}"></div>
                </div>
              </div>
            `).join('')}
          </div>

          <div class="idea-sections">
            ${idea.problem ? `<div class="idea-section"><div class="idea-section-title">문제 정의</div><div class="idea-section-content">${md(idea.problem)}</div></div>` : ''}
            ${idea.solution ? `<div class="idea-section"><div class="idea-section-title">솔루션</div><div class="idea-section-content">${md(idea.solution)}</div></div>` : ''}
            ${idea.revenue ? `<div class="idea-section"><div class="idea-section-title">수익 모델</div><div class="idea-section-content">${md(idea.revenue)}</div></div>` : ''}
            ${idea.techStack ? `<div class="idea-section"><div class="idea-section-title">기술 스택</div><div class="idea-section-content">${md(idea.techStack)}</div></div>` : ''}
            ${idea.risks ? `<div class="idea-section"><div class="idea-section-title">리스크</div><div class="idea-section-content">${md(idea.risks)}</div></div>` : ''}
            ${idea.nextSteps ? `<div class="idea-section"><div class="idea-section-title">다음 단계</div><div class="idea-section-content">${md(idea.nextSteps)}</div></div>` : ''}
          </div>
        </div>
      `).join('');
    }

    function renderResearch() {
      const container = document.getElementById('researchContent');
      const items = [
        DATA.research.global,
        DATA.research.korean,
        ...DATA.research.channels
      ].filter(Boolean);

      container.innerHTML = items.map(r => `
        <div class="card">
          <div class="card-title collapsible-toggle" onclick="toggleCollapse(this)">
            ${r.title}
          </div>
          <div class="collapsible-body">
            <div class="md-content">${md(r.content.replace(/^# .+\n/, ''))}</div>
          </div>
        </div>
      `).join('');
    }

    function renderMarketing() {
      const container = document.getElementById('marketingContent');
      container.innerHTML = DATA.marketing.map(m => `
        <div class="card">
          <div class="card-title collapsible-toggle" onclick="toggleCollapse(this)">
            ${m.title}
          </div>
          <div class="collapsible-body">
            <div class="md-content">${md(m.content.replace(/^# .+\n/, ''))}</div>
          </div>
        </div>
      `).join('');
    }

    function renderLog() {
      const container = document.getElementById('logContent');
      if (DATA.latestLog) {
        container.innerHTML = `
          <div class="card">
            <div class="card-title">${DATA.latestLog.title}</div>
            <div class="md-content">${md(DATA.latestLog.content.replace(/^# .+\n/, ''))}</div>
          </div>
        `;
      }
    }

    function toggleCollapse(el) {
      el.classList.toggle('open');
      el.nextElementSibling.classList.toggle('open');
    }

    async function triggerResearch() {
      const btn = document.getElementById('researchBtn');
      btn.disabled = true;
      btn.textContent = '조사 중...';

      try {
        // GitHub Actions workflow_dispatch trigger
        // 실제 사용시 GITHUB_TOKEN과 repo 정보 필요
        const owner = 'YOUR_GITHUB_USERNAME';
        const repo = 'money-1';
        const res = await fetch(
          `https://api.github.com/repos/${owner}/${repo}/actions/workflows/research.yml/dispatches`,
          {
            method: 'POST',
            headers: {
              'Authorization': `token YOUR_GITHUB_TOKEN`,
              'Accept': 'application/vnd.github.v3+json'
            },
            body: JSON.stringify({ ref: 'main' })
          }
        );

        if (res.status === 204) {
          alert('재조사가 시작되었습니다! 몇 분 후 새로고침하세요.');
        } else {
          alert('GitHub Actions 설정을 확인하세요. (README 참고)');
        }
      } catch (e) {
        alert('재조사 트리거 실패. GitHub 설정을 확인하세요.');
      } finally {
        btn.disabled = false;
        btn.textContent = '재조사';
      }
    }

    // Feed
    let currentFeedFilter = 'all';

    function renderFeed(filter) {
      currentFeedFilter = filter || 'all';
      const container = document.getElementById('feedContent');
      const empty = document.getElementById('feedEmpty');

      if (!DATA.collected || DATA.collected.length === 0) {
        container.innerHTML = '';
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';

      const items = currentFeedFilter === 'all'
        ? DATA.collected
        : DATA.collected.filter(c => c.source === currentFeedFilter);

      // Group by date
      const grouped = {};
      for (const item of items) {
        if (!grouped[item.date]) grouped[item.date] = [];
        grouped[item.date].push(item);
      }

      container.innerHTML = Object.entries(grouped).map(([date, items]) => `
        <div style="margin-bottom:24px">
          <h3 style="font-size:14px;color:var(--text-dim);margin-bottom:12px">${date}</h3>
          ${items.map(item => `
            <div class="card" style="padding:14px;margin-bottom:8px">
              <div style="display:flex;justify-content:space-between;align-items:start;gap:12px">
                <div style="flex:1">
                  <a href="${item.url}" target="_blank" style="color:var(--text);text-decoration:none;font-weight:500;font-size:14px">
                    ${item.title}
                  </a>
                  ${item.description ? `<div style="font-size:12px;color:var(--text-dim);margin-top:4px">${item.description}</div>` : ''}
                </div>
                <div style="display:flex;gap:8px;align-items:center;flex-shrink:0">
                  ${item.score ? `<span style="font-size:12px;color:var(--yellow)">▲${item.score}</span>` : ''}
                  ${item.comments ? `<span style="font-size:12px;color:var(--text-dim)">💬${item.comments}</span>` : ''}
                  <span style="font-size:11px;padding:2px 6px;background:var(--surface2);border-radius:4px;color:var(--accent)">${item.source}${item.subreddit ? '/'+item.subreddit : ''}</span>
                </div>
              </div>
            </div>
          `).join('')}
        </div>
      `).join('');

      // Update filter buttons
      document.querySelectorAll('.feed-filter').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.source === currentFeedFilter);
        if (btn.classList.contains('active')) {
          btn.style.borderColor = 'var(--accent)';
          btn.style.color = 'var(--accent)';
        } else {
          btn.style.borderColor = '';
          btn.style.color = '';
        }
      });
    }

    // Feed filter click
    document.getElementById('panel-feed').addEventListener('click', (e) => {
      const btn = e.target.closest('.feed-filter');
      if (btn) renderFeed(btn.dataset.source);
    });

    // Load data
    async function init() {
      try {
        const res = await fetch('./data.json');
        DATA = await res.json();

        document.getElementById('loading').style.display = 'none';
        document.getElementById('buildTime').textContent =
          `빌드: ${new Date(DATA.buildTime).toLocaleString('ko-KR')}`;

        renderOverview();
        renderFeed();
        renderIdeas();
        renderResearch();
        renderMarketing();
        renderLog();
      } catch (e) {
        document.getElementById('loading').innerHTML =
          '<p style="color:var(--red)">data.json을 로드할 수 없습니다.<br><code>node scripts/build.js</code>를 먼저 실행하세요.</p>';
      }
    }

    init();
  </script>
</body>
</html>
